AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Serverless Product API - V2

  '
Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for authentication
    Default: us-east-1_E4wY07xrz
Globals:
  Function:
    Timeout: 20
    LoggingConfig:
      LogFormat: JSON
  Api:
    Cors:
      AllowMethods: '''*'''
      AllowHeaders: '''*'''
      AllowOrigin: '''*'''
    Auth:
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn:
            Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
Resources:
  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ProductFunction
      Handler: handlers/product.handler
      Runtime: nodejs18.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProductsTable
      Environment:
        Variables:
          PRODUCTS_TABLE: TrueTasteProducts
          AWS_REGION: us-east-1
      Events:
        ProductList:
          Type: Api
          Properties:
            Path: /products
            Method: get
            Auth:
              Authorizer: NONE
        ProductCreate:
          Type: Api
          Properties:
            Path: /products
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        ProductOptions:
          Type: Api
          Properties:
            Path: /products
            Method: options
            Auth:
              Authorizer: NONE
        ProductDetailGet:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: get
            Auth:
              Authorizer: NONE
        ProductDetailPut:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer
        ProductDetailDelete:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuthorizer
        ProductDetailOptions:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: options
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: ProductFunction
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteProducts
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteUsers
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  CategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteCategories
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  CategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CategoriesFunction
      Handler: handlers/categories.handler
      Runtime: nodejs18.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CategoriesTable
      Environment:
        Variables:
          CATEGORIES_TABLE: TrueTasteCategories
          AWS_REGION: us-east-1
      Events:
        ListCategories:
          Type: Api
          Properties:
            Path: /categories
            Method: any
        CategoryDetail:
          Type: Api
          Properties:
            Path: /categories/{id}
            Method: any
    Metadata:
      SamResourceId: CategoriesFunction
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UsersFunction
      Handler: handlers/users.handler
      Runtime: nodejs18.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTable
      Environment:
        Variables:
          USERS_TABLE: TrueTasteUsers
          AWS_REGION: us-east-1
      Events:
        UsersMe:
          Type: Api
          Properties:
            Path: /users/me
            Method: any
        UsersList:
          Type: Api
          Properties:
            Path: /users
            Method: get
    Metadata:
      SamResourceId: UsersFunction
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteOrders
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: createdAt
        KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: OrdersFunction
      Handler: handlers/orders.handler
      Runtime: nodejs18.x
      Architectures:
      - x86_64
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: OrdersTable
      Environment:
        Variables:
          ORDERS_TABLE: TrueTasteOrders
          AWS_REGION: us-east-1
      Events:
        ListOrders:
          Type: Api
          Properties:
            Path: /orders
            Method: any
        OrderDetail:
          Type: Api
          Properties:
            Path: /orders/{id}
            Method: any
    Metadata:
      SamResourceId: OrdersFunction
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - POST
          - HEAD
          AllowedOrigins:
          - '*'
          MaxAge: 3000
  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UploadsFunction
      Handler: handlers/get-upload-url.handler
      Runtime: nodejs18.x
      Architectures:
      - x86_64
      Policies:
      - S3WritePolicy:
          BucketName:
            Ref: UploadsBucket
      Environment:
        Variables:
          UPLOAD_BUCKET:
            Ref: UploadsBucket
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: any
    Metadata:
      SamResourceId: UploadsFunction
Outputs:
  ProductApiUrl:
    Description: API Gateway endpoint URL for Prod stage
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  UploadApiUrl:
    Description: URL to request upload signature
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-url
  ProductFunction:
    Description: Product Lambda Function ARN
    Value:
      Fn::GetAtt:
      - ProductFunction
      - Arn

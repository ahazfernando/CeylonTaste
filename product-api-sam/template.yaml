AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Product API - V2

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:
  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/product.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref ProductsTable
      Events:
        ProductApi:
          Type: Api
          Properties:
            Path: /products
            Method: any
        ProductDetail:
          Type: Api
          Properties:
            Path: /products/{id}
            Method: any
  
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteProducts
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteUsers
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  CategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteCategories
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  CategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/categories.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CategoriesTable
      Environment:
        Variables:
          CATEGORIES_TABLE: !Ref CategoriesTable
      Events:
        ListCategories:
          Type: Api
          Properties:
            Path: /categories
            Method: any
        CategoryDetail:
          Type: Api
          Properties:
            Path: /categories/{id}
            Method: any

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/users.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
      Events:
        UsersMe:
          Type: Api
          Properties:
            Path: /users/me
            Method: any
        UsersList:
          Type: Api
          Properties:
            Path: /users
            Method: get


  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TrueTasteOrders
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/orders.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
      Events:
        ListOrders:
          Type: Api
          Properties:
            Path: /orders
            Method: any
        OrderDetail:
          Type: Api
          Properties:
            Path: /orders/{id}
            Method: any

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/get-upload-url.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadsBucket
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadsBucket
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: any

Outputs:
  ProductApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  UploadApiUrl:
    Description: "URL to request upload signature"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/upload-url"

  ProductFunction:
    Description: "Product Lambda Function ARN"
    Value: !GetAtt ProductFunction.Arn

